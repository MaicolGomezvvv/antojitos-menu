<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANTOJITOS | Menú</title>
<meta name="description" content="Menú de ANTOJITOS. Fresas, obleas y helados caseros.">
<style>
:root {
  --pink:#f58dca;
  --pink2:#ffb6df;
  --dark:#242024;
  --cream:#fffafd;
}
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { margin:0; font-family:Arial,Helvetica,sans-serif; background:var(--cream); color:var(--dark); }
.hero { min-height:72vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:50px 20px; position:relative; overflow:hidden; background:white; }
.hero:before,.hero:after { content:""; position:absolute; border-radius:50%; background:var(--pink2); opacity:.65; }
.hero:before { width:330px;height:330px;left:-150px;top:-130px; }
.hero:after { width:280px;height:280px;right:-130px;bottom:-130px; }
.content { position:relative; z-index:1; max-width:760px; }
.handle { color:var(--pink); font-weight:700; font-size:1.05rem; }
h1 { font-size:clamp(3.2rem,12vw,7rem); line-height:.9; margin:15px 0; color:var(--pink); letter-spacing:3px; }
.tagline { font-size:clamp(1.2rem,3vw,1.8rem); font-weight:700; margin:20px auto; max-width:600px; }
.buttons { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:28px; }
.btn { display:inline-block; padding:15px 24px; border-radius:999px; text-decoration:none; font-weight:700; }
.primary { background:var(--pink); color:white; }
.secondary { border:2px solid var(--pink); color:var(--pink); background:white; }
section.menu { max-width:900px; margin:auto; padding:45px 18px; }
.menu-title { text-align:center; color:var(--pink); font-size:2rem; margin:0 0 24px; }
.menu-card { background:white; border-radius:28px; padding:12px; box-shadow:0 12px 35px rgba(245,141,202,.16); margin-bottom:24px; }
.menu-card img { display:block; width:100%; height:auto; border-radius:20px; }
.contact-section { padding:0; max-width:100%; margin:0; }
.info { background:var(--pink); color:white; text-align:center; padding:70px 20px; min-height:70vh; display:flex; flex-direction:column; justify-content:center; align-items:center; }
.info h2 { color:white; font-size:clamp(2rem,6vw,3rem); margin:0 0 25px; }
.info p { font-size:1.05rem; line-height:1.6; margin:10px 0; }
.delivery { font-size:1.2rem !important; margin:20px 0 !important; }
.address { background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.4); border-radius:18px; padding:15px 25px; margin:15px 0 25px; font-size:1.05rem; line-height:1.6; }
.phone { font-size:1.8rem; font-weight:800; margin:10px 0; }
.info .buttons { margin-top:20px; }
.info .secondary { color:var(--pink); border:none; box-shadow:0 8px 20px rgba(0,0,0,.12); }
footer { text-align:center; padding:20px; background:white; color:#777; }
@media(max-width:600px) { .hero { min-height:80vh; } .info { min-height:80vh; padding:55px 18px; } .address { width:100%; max-width:360px; } }
</style>
</head>
